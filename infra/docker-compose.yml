name: customer-service-ai-bot

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_service_bot}
      POSTGRES_USER: ${POSTGRES_USER:-customer_service_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/production.env
    environment:
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-customer_service_bot}:${POSTGRES_PASSWORD:-change-this-db-password}@db:5432/${POSTGRES_DB:-customer_service_bot}
      APP_REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/production.env
    environment:
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-customer_service_bot}:${POSTGRES_PASSWORD:-change-this-db-password}@db:5432/${POSTGRES_DB:-customer_service_bot}
      APP_REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - db
      - redis

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    restart: unless-stopped
    env_file:
      - ./env/production.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NODE_ENV: production
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  redis-data:
