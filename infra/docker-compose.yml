services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_service_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/production.env.example
    environment:
      APP_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/customer_service_bot
      APP_REDIS_URL: redis://redis:6379/0
      APP_AUTO_CREATE_SCHEMA: "true"
      APP_BOOTSTRAP_DEMO_DATA: "true"
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/production.env.example
    environment:
      APP_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/customer_service_bot
      APP_REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  redis-data:
