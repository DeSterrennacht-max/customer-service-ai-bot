[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-service-bot-worker"
version = "1.1.2"
description = "Celery worker for the Telegram customer service bot"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.4.0",
  "sqlalchemy>=2.0.36",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
