[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-service-bot-api"
version = "1.1.0"
description = "FastAPI backend for the Telegram customer service bot"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.1",
  "aiogram>=3.15.0",
  "bcrypt==4.0.1",
  "email-validator>=2.2.0",
  "celery[redis]>=5.4.0",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.7.1",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["../..", "."]
testpaths = ["tests"]
